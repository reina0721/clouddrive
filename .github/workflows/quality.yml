name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify validation scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      docs: ${{ steps.scope.outputs.docs }}
      database: ${{ steps.scope.outputs.database }}
      api: ${{ steps.scope.outputs.api }}
      fuzz: ${{ steps.scope.outputs.fuzz }}
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1e60f620b9541dca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Test validation selection and failure boundaries
        run: node --test scripts/verify-changed.test.mjs scripts/verify-artifacts.test.mjs
      - id: scope
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_FULL: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        run: node scripts/ci-validation.mjs classify

  windows:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Windows quality gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node for validation
        uses: actions/setup-node@1e60f620b9541dca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Run quality gates
        shell: pwsh
        env:
          VALIDATION_BASE: ${{ needs.changes.outputs.base }}
          VALIDATION_FULL: ${{ needs.changes.outputs.full }}
        run: node scripts/ci-validation.mjs backend

  linux:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Linux quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node for validation
        uses: actions/setup-node@1e60f620b9541dca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Run quality gates
        env:
          VALIDATION_BASE: ${{ needs.changes.outputs.base }}
          VALIDATION_FULL: ${{ needs.changes.outputs.full }}
        run: node scripts/ci-validation.mjs backend
      - name: Run bounded fuzz gate
        if: needs.changes.outputs.fuzz == 'true'
        run: go test ./internal/kernel/config -run '^$' -fuzz '^FuzzJSONObject$' -fuzztime 15s

  webui-windows:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Windows frontend quality gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541dca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Set up pnpm
        shell: pwsh
        run: |
          $pnpmRoot = Join-Path $env:RUNNER_TEMP 'clouddrive-pnpm'
          & npm install --prefix $pnpmRoot --no-package-lock --no-save pnpm@10.22.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $pnpmRoot 'node_modules/.bin') >> $env:GITHUB_PATH
      - name: Run frontend quality gates
        shell: pwsh
        env:
          VALIDATION_BASE: ${{ needs.changes.outputs.base }}
          VALIDATION_FULL: ${{ needs.changes.outputs.full }}
        run: node scripts/ci-validation.mjs frontend

  webui-linux:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Linux frontend quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541dca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Set up pnpm
        shell: pwsh
        run: |
          $pnpmRoot = Join-Path $env:RUNNER_TEMP 'clouddrive-pnpm'
          & npm install --prefix $pnpmRoot --no-package-lock --no-save pnpm@10.22.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $pnpmRoot 'node_modules/.bin') >> $env:GITHUB_PATH
      - name: Run frontend quality gates
        env:
          VALIDATION_BASE: ${{ needs.changes.outputs.base }}
          VALIDATION_FULL: ${{ needs.changes.outputs.full }}
        run: node scripts/ci-validation.mjs frontend

  docs-windows:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Windows documentation quality gates
    runs-on: windows-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node for validation
        uses: actions/setup-node@1e60f620b9541dca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Run documentation quality gates
        shell: pwsh
        env:
          VALIDATION_BASE: ${{ needs.changes.outputs.base }}
          VALIDATION_FULL: ${{ needs.changes.outputs.full }}
        run: node scripts/ci-validation.mjs docs

  docs-linux:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Linux documentation quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up Node for validation
        uses: actions/setup-node@1e60f620b9541dca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - name: Run documentation quality gates
        env:
          VALIDATION_BASE: ${{ needs.changes.outputs.base }}
          VALIDATION_FULL: ${{ needs.changes.outputs.full }}
        run: node scripts/ci-validation.mjs docs

  openapi-breaking:
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name == 'pull_request'
    name: OpenAPI breaking gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compare OpenAPI authority with merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p tmp/openapi
          git show "${BASE_SHA}:api/openapi.yaml" > tmp/openapi/base.yaml
          go tool oasdiff breaking tmp/openapi/base.yaml api/openapi.yaml --fail-on ERR

  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned scanners
        run: |
          tool_dir="$(node scripts/project-layout.mjs --field toolsRoot)"
          mkdir -p "${tool_dir}"
          GOBIN="${tool_dir}" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOBIN="${tool_dir}" go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          GOBIN="${tool_dir}" go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "${tool_dir}" >> "${GITHUB_PATH}"
      - name: Reachable vulnerability scan
        run: govulncheck ./...
      - name: Go security scan
        run: gosec -exclude-generated ./...
      - name: Secret scan
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
      - name: Tracked artifact allowlist
        run: bash scripts/verify-artifacts.sh

  summary:
    name: Validation summary
    if: always()
    needs:
      [
        changes,
        windows,
        linux,
        webui-windows,
        webui-linux,
        docs-windows,
        docs-linux,
        openapi-breaking,
        security,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require success or intentional skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>!["success","skipped"].includes(job.result))) process.exit(1)'
