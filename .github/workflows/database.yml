name: Database

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify validation scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      docs: ${{ steps.scope.outputs.docs }}
      database: ${{ steps.scope.outputs.database }}
      api: ${{ steps.scope.outputs.api }}
      fuzz: ${{ steps.scope.outputs.fuzz }}
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1e60f620b9541dca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
      - id: scope
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_FULL: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        run: node scripts/ci-validation.mjs classify

  sqlite:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    name: SQLite migration and repository contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./internal/module/migration ./pkg/database -count=1

  postgres:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    name: PostgreSQL contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: scaffold_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scaffold_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run PostgreSQL migration and repository contracts
        env:
          TEST_DATABASE_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/scaffold_test?sslmode=disable
          TEST_MIGRATION_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/scaffold_test?sslmode=disable
        run: |
          go test ./internal/module/migration -run TestConfiguredServerMigrations/postgres -count=1
          go test ./pkg/database -run TestConfiguredServerDrivers/postgres -count=1

  mysql:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    name: MySQL contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: scaffold_test
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run MySQL migration and repository contracts
        env:
          TEST_DATABASE_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/scaffold_test?parseTime=true
          TEST_MIGRATION_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/scaffold_test?parseTime=true
        run: |
          go test ./internal/module/migration -run TestConfiguredServerMigrations/mysql -count=1
          go test ./pkg/database -run TestConfiguredServerDrivers/mysql -count=1

  summary:
    name: Database summary
    if: always()
    needs: [changes, sqlite, postgres, mysql]
    runs-on: ubuntu-latest
    steps:
      - name: Require success or intentional skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>!["success","skipped"].includes(job.result))) process.exit(1)'
