schema_version: 1
id: R123-001
title: WebDAV业务文件系统、凭据和协议承载
question: 如何用成熟WebDAV实现对现有云端文件提供限定根目录的独立读写连接，同时保留租约、原子发布、权限和容量边界？
research_type: current-project
topics: [webdav, application-credentials, streaming-ingest, protocol-routing]
keywords: [连接与挂载, PROPFIND, Basic, atomic-replace, go-webdav]
applicable_scenarios: [单机持久暂存, 现有files目录与IAM账号, 受限WebDAV文件操作]
non_applicable_scenarios: [无共享暂存多机, DAV锁协同与任意dead properties, CalDAV, CardDAV, 实际操作系统驱动认证]
status: active
summary: 采用emersion/go-webdav v0.7.0的同步业务后端；保留流式Storage和授权；扩展现有传输核心支持服务端摘要与CAS覆盖；独立协议路由不伪装成Huma标准method。
