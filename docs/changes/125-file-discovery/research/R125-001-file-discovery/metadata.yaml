schema_version: 1
id: R125-001
title: 高级文件检索与视图操作边界
question: 如何按参考站真实界面补齐条件检索、可见子树范围和视图交互，同时限制元数据扫描并保留既有文件权限？
research_type: current-project
topics: [advanced-file-search, bounded-metadata-query, file-view, selection]
keywords: [高级搜索, 关键词, 文件大小, 日期, 分页, 缩略图, 范围选择]
applicable_scenarios: [当前账号文件元数据, 私有文件页, 有界目录树, 本地视图偏好]
non_applicable_scenarios:
  [文件内容全文检索, 标签服务, 媒体分析索引, 外部搜索引擎, 账号协作授权]
status: active
summary: 保留GORM与标准库，单轨扩展List为有界元数据条件查询；Host继续拥有偏好与键盘DOM动作，不引入索引进程或新资源。
