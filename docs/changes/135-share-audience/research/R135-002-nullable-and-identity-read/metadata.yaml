question: 如何保持显式null的HTTP契约，并在上传最终事务中复核当前身份而不争用SQLite写锁？
research_type: implementation-directed-verification
topics: [nullable-policy, HTTP-schema, IAM-snapshot, transfer-publication]
keywords: [Huma, SchemaProvider, null, SQLite, 单次读取]
