question: 如何消除整块内存上传与刷新丢失，接入成熟续传协议并保留身份、配额、存储租约和公开分享边界？
research_type: current-project
topics: [resumable-upload, streaming-storage, transfer-lifecycle]
keywords: [tus, tusd, tus-js-client, Range, SHA256, 传输中心]
applicable_scenarios: [第三批本地网盘传输, 单服务本地暂存, 现有local及S3-compatible对象存储]
non_applicable_scenarios: [无共享暂存的多主机集群, 离线下载, WebDAV, 浏览器关闭后自动读取用户磁盘]
status: active
