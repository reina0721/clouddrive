schema_version: 1
id: R141-001
title: WebDAV写锁与跨入口事务边界
question: 如何在同步Storage租约及原子文件事务内实现持久URL锁，并覆盖所有写入口
research_type: current-project
topics: [WebDAV, 文件写入占用, 文件事务]
keywords: [LOCK, UNLOCK, If, RFC4918, URL命名空间, emersion, x/net]
status: active
summary: 保留成熟普通DAV，在files事务内保存URL写锁并有界扩展协议；不引入上游未合并实现或内存锁
researched_at: '2026-11-06'
verified_at: '2026-11-06'
revision: 1d2f33a81696ea9fccd8889fa3ac977cfabb3708
questions:
  - 成熟协议实现能否在同步内容租约与原子业务写入边界接入持久锁
  - 哪些真实写入口必须在同一owner事务内检查锁
  - URL锁在目录成员变化及MOVE后如何保持RFC语义
applicable_scenarios:
  - 当前files模块及Go1.26.10、emersion/go-webdav0.7.0、golang.org/x/net0.62.0
non_applicable_scenarios: [共享锁, Office服务, 跨账号锁, 任意文件系统协议框架]
