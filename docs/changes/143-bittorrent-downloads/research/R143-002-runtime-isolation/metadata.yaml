schema_version: 1
id: R143-002
title: aria2元数据隔离、同hash任务与重启的实证
question: 哪个下载器可以先获得元数据而不下载内容，并隔离同hash任务、选择与重启身份？
research_type: runtime-and-external-primary-source
topics: [bittorrent, aria2, rpc, download-node, metadata, isolation]
keywords: [metadata-only, GID, MSYS2, TLS, bencode, Transmission]
applicable_scenarios: [配置受控aria2节点并共享暂存目录, 当前files多文件下载扩展]
non_applicable_scenarios: [任意用户RPC节点, 不共享目录的远程代理, 宣称产品已完成BT, BitTorrent-v2]
status: active
summary: 实际peer交换证明aria2元数据阶段不生成payload，选择、独立GID和重启持久化可用；选择受控外部aria2及固定安全修复版bencode，产品接入尚待实施。
