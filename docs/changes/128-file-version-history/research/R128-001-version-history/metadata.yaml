schema_version: 1
id: R128-001
title: 文件版本历史与不可变对象引用
question: 如何完整接入文本、WebDAV、分块覆盖与复制的历史记录，同时正确核算配额并保护当前内容？
research_type: current-project
status: active
topics: [file-versions, immutable-content, quota, overwrite, bounded-history]
keywords: [版本历史, 恢复, 配额, 分块覆盖, 引用复制]
applicable_scenarios: [当前私有文件, 本地或S3存储, 新的内容变更, 同账号历史管理]
non_applicable_scenarios: [推测升级前缺失版本, 外部修改存储对象, 自动物理垃圾回收, 全文差异算法]
summary: 保留现有Storage租约与GORM owner事务，用有界类型化版本快照落入具体record JSON，新增v10；复制深拷贝关联，历史计入逻辑空间，不自动删除。
