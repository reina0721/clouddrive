schema_version: 1
id: R130-001
title: 分享链接协作的权限范围与原子发布
question: 如何扩展只读分享为真实文件协作，同时复用文件用例、持久传输与最终事务授权？
research_type: current-project-and-primary-source
status: active
topics: [share-collaboration, capability-scope, transaction-authorization, tus, publication]
keywords: [分享权限, 只读, 仅上传, 可编辑, 票据版本, CAS, 范围逃逸]
applicable_scenarios: [当前实例分享链接, 现有IAM与GORM和Storage, 文件或目录范围内协作, 单机共享暂存]
non_applicable_scenarios: [本批用户或用户组ACL, 子项继承权限, Office或WebDAV锁, 跨站分享, 多主机无共享暂存]
summary: 分享拥有独立权限和策略版本；请求范围仓储在同一owner事务校验分享/票据/子树，复用现有文件用例；SourceShare复用tus与原发布并在最终事务检查策略围栏，不另建存储或上传机制。
evidence:
  types: [source-code, browser-observation, official-documentation, existing-research]
  primary_sources:
    - locator: internal/module/files/service/sharing.go
      snapshot: bb1820b；Share仅只读，无权限、策略版本或修改配置入口，PublicFilesPort仅metadata/unlock/entries/download
    - locator: internal/module/files/service/transfers.go
      snapshot: bb1820b；tus统一预留/摘要/发布，downloadPublication在最终Transfer事务验证持久围栏
    - locator: internal/module/files/repo/repository.go
      snapshot: bb1820b；saveEntryChanges为同storage/owner事务内唯一批量目录写入
    - locator: frontend/apps/web/next.config.ts
      snapshot: bb1820b；同源rewrite有32MiB代理预算，不能用单次整文件请求代替大文件上传
    - locator: https://github.com/cloudreve/cloudreve/discussions/2522
      snapshot: 2026-11-04官方V4公告；分享协作/权限，普通编辑ETag与Office锁是不同机制
    - locator: https://docs.cloudreve.org/en/usage/concept
      snapshot: 2026-11-04；分享根权限与子项继承语义是独立设计，不等于IAM账号所有权
    - locator: https://casbin.apache.org/docs/overview/
      snapshot: 2026-11-04；规则模型/策略管理不能代替应用事务与对象范围复核
