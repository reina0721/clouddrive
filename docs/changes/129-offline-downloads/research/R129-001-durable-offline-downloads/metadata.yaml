schema_version: 1
id: R129-001
title: 持久离线下载的任务、传输和出站边界
question: 如何接入真实服务端HTTP下载、暂停续传和重启恢复，并为完整Cloudreve离线能力保留正确任务边界而不复制队列和文件发布？
research_type: current-project-and-external-primary-source
status: active
topics: [offline-download, durable-task, transfer-publication, scheduler, ssrf, http-range]
keywords: [离线下载, DownloadTask, SourceOffline, If-Range, fencing, net-http, grab, aria2]
applicable_scenarios: [单机共享暂存的HTTP或HTTPS文件下载, 当前IAM与GORM和Storage, 有界持久任务, 当前Scheduler生命周期]
non_applicable_scenarios: [本批磁力或种子下载, 本批多文件选择和远程节点, 任意本地路径, 未约束出站网络的下载器RPC]
summary: 采用标准net/http受控源Adapter，下载任务独立聚合并关联既有Transfer，复用tusd暂存与配额发布；Scheduler托管派发，持久租约围栏保护最终发布，HTTP先行而不冒充完整BT能力。
