schema_version: 1
id: R134-001
title: PDF阅读器与Host资源边界
question: 如何补齐Cloudreve的PDF阅读、查找与标注，同时复用成熟解析和现有会话内容读取？
research_type: current-project-and-official-source
topics: [PDF, PDF.js, browser-worker, content-budget, file-preview]
keywords: [pdfjs-dist, iframe, PDFViewer, PDFFindController, annotation]
status: superseded
summary: 选择pdfjs-dist6.4.299的display/viewer组件，Host拥有隔离样式的frame、显式Worker和窄命令协议；不自研PDF解析或新建服务。
applicable_scenarios: [本人有界PDF, 当前与旧版私有内容, 支持现代ESM和Worker的浏览器]
non_applicable_scenarios: [Office转换, 公开分享PDF, 服务器PDF渲染, 任意大文档, 原地保存标注, 对解码堆内存的硬上限承诺]
